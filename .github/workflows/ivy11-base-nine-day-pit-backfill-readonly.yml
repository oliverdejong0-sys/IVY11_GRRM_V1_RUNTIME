name: IVY11 BASE - Nine Day Historical PIT Backfill (READ ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ivy11-nine-day-pit-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without permission to push
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTPS reader
        run: python -m pip install "requests>=2.32,<3"
      - name: Historical market-day source snapshots
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/IVY11_BASE_pit_backfill_readonly.py --out base_pit_backfill
      - name: Make diagnostic failures visible
        if: always()
        shell: bash
        run: |
          if [ -f base_pit_backfill/BACKFILL_BERICHT.md ]; then
            cat base_pit_backfill/BACKFILL_BERICHT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source backfill did not finish; NO-GO" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save research as-of evidence even after errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IVY11_BASE_NEUN_TAGE_PIT_BELEGE
          path: base_pit_backfill/
          retention-days: 30
          if-no-files-found: warn
