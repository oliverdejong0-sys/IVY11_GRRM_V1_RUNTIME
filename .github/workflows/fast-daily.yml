name: IVY11 GRRM Fast Daily Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 23 * * 1-5"
    - cron: "30 0 * * 2-6"

concurrency:
  group: ivy11-grrm-runtime-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-fast-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build frozen-model fast snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src/IVY11_GRRM_V1_build_fast_snapshot.py

      - name: Build full-risk diagnostic snapshot
        run: python src/IVY11_GRRM_V1_build_full_risk_snapshot.py

      - name: Commit snapshots if changed
        run: |
          git config user.name "ivy11-grrm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/latest_fast_snapshot.json docs/latest_fast_snapshot.md
          git add docs/latest_full_risk_snapshot.json docs/latest_full_risk_snapshot.md
          if git diff --cached --quiet; then
            echo "No snapshot change."
            exit 0
          fi
          git commit -m "IVY11 GRRM runtime snapshots"

          # Remote may have advanced since checkout. Rebase our generated
          # snapshot commit before pushing; retry once if a race still occurs.
          git fetch origin main
          git rebase origin/main
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
